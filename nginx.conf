# nginx del chef app — replica el web.config de IIS:
#   - proxya /api/ y /notificationHub al servicio interno del API
#   - sirve el SPA con fallback a index.html
#
# IMPORTANTE: el upstream apunta a "cociname-prd_api" → el servicio del API en
# EasyPanel DEBE llamarse "api" dentro del proyecto "cociname-prd". Si le pones
# otro nombre, ajusta el host aquí. El puerto 8080 es el que expone el contenedor .NET.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API → servicio interno (preserva el prefijo /api/). resolver = DNS interno de Docker,
    # así nginx arranca aunque el API aún no esté arriba y re-resuelve en cada request.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream_api cociname-prd_api;
        proxy_pass http://$upstream_api:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (WebSocket)
    location /notificationHub {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream_hub cociname-prd_api;
        proxy_pass http://$upstream_hub:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Service worker: sin caché para que las actualizaciones lleguen siempre
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /sw.js =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files /manifest.json =404;
    }

    # Assets con hash en el nombre → caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (sirve index.html para rutas del cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
